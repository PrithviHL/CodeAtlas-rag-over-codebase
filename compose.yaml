services:
  codeatlas:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - codeatlas-data:/app/data
    environment:
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  codeatlas-data:
