[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "langgraph>=1,<2", "anthropic>=0.70,<1", "qdrant-client>=1.15,<2",
  "tree-sitter-language-pack>=0.10,<2"
]
[project.optional-dependencies]
models = ["sentence-transformers>=5,<6"]
test = ["pytest>=8,<10"]
[project.scripts]
codeatlas-engine = "codeatlas_engine.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["codeatlas_engine*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
